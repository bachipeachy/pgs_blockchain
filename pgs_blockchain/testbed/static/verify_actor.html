<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Actor — Blockchain Wallet</title>
    <link rel="stylesheet" href="css/wallet.css">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <img src="img/pgs_logo.png" alt="PGS" class="logo">
            <h1 class="app-title">Blockchain Wallet</h1>
            <img src="img/ob_logo.png" alt="PGS" class="logo">
        </div>
        <nav class="screen-nav">
            <a href="register_actor.html">Register Actor</a>
            <a href="verify_actor.html" class="active">Verify Actor</a>
            <a href="create_wallet.html">Create Wallet</a>
            <a href="submit_transaction.html">Submit Transaction</a>
            <a href="register_validator.html">Register Validator</a>
        </nav>
    </header>

    <div class="container">
        <h2>Actor Verification</h2>

        <form id="verify-form" data-workflow="blockchain::WF_VERIFY_ACTOR_V0"
              data-structure="governance.layers::STRUCTURE_RUNTIME_EXECUTION_V0"
              onsubmit="event.preventDefault(); submitWorkflow('verify-form');">

            <div class="form-group">
                <label for="actor_id">Actor ID</label>
                <input type="text" id="actor_id" data-field="actor_id" placeholder="AC_..." required>
            </div>

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" data-field="actor_record.first_name" required>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" data-field="actor_record.last_name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" data-field="actor_record.email_registration" required>
            </div>

            <div class="form-group">
                <label for="verifier_id">Verifier ID</label>
                <input type="text" id="verifier_id" data-field="verifier_id" value="AC_SYSTEM_ADMIN_001" required>
            </div>

            <div class="form-group">
                <label for="decision">Decision</label>
                <select id="decision" data-field="decision" required>
                    <option value="VERIFIED">VERIFIED</option>
                    <option value="REJECTED">REJECTED</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" data-field="notes" placeholder="Optional verification notes"></textarea>
            </div>

            <button type="submit" class="primary-button">Submit Verification</button>
        </form>

        <div id="result" class="result-panel"></div>
    </div>

    <footer class="app-footer">
        PGS Thin Client Transport v0 — Protocol-Governed Systems
    </footer>

    <script src="js/wallet_bridge.js"></script>
</body>
</html>
