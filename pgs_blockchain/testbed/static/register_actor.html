<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Actor — Blockchain Wallet</title>
    <link rel="stylesheet" href="css/wallet.css">
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <img src="img/pgs_logo.png" alt="PGS" class="logo">
            <h1 class="app-title">Blockchain Wallet</h1>
            <img src="img/ob_logo.png" alt="PGS" class="logo">
        </div>
        <nav class="screen-nav">
            <a href="register_actor.html" class="active">Register Actor</a>
            <a href="verify_actor.html">Verify Actor</a>
            <a href="create_wallet.html">Create Wallet</a>
            <a href="submit_transaction.html">Submit Transaction</a>
            <a href="register_validator.html">Register Validator</a>
        </nav>
    </header>

    <div class="container">
        <h2>User / Actor Registration</h2>

        <form id="registration-form" data-workflow="blockchain::WF_REGISTER_ACTOR_UNVERIFIED_V0"
              data-structure="governance.layers::STRUCTURE_RUNTIME_EXECUTION_V0"
              onsubmit="event.preventDefault(); submitWorkflow('registration-form');">

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" data-field="actor_record.first_name" required>
            </div>

            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" data-field="actor_record.last_name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" data-field="actor_record.email_registration" required>
            </div>

            <button type="submit" class="primary-button">Register Actor</button>
        </form>

        <div id="result" class="result-panel"></div>
    </div>

    <footer class="app-footer">
        PGS Thin Client Transport v0 — Protocol-Governed Systems
    </footer>

    <script src="js/wallet_bridge.js"></script>
</body>
</html>
