[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pgs_blockchain"
version = "0.3.0"
description = "PGS Blockchain Domain — identity, wallet, transaction, and consensus capability transforms"
readme = "README.md"
requires-python = ">=3.10"

license = "Apache-2.0"

authors = [
  { name = "Bachi" }
]

dependencies = [
  "bip_utils>=2.12.0",
  "pycryptodome>=3.23.0",
  "cryptography>=47.0.0"
]

keywords = ["pgs", "protocol", "blockchain", "cryptography", "capability-transforms"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/bachipeachy/pgs_blockchain"
Repository = "https://github.com/bachipeachy/pgs_blockchain"

[tool.setuptools.packages.find]
include = ["pgs_blockchain*"]

[tool.setuptools]
include-package-data = true